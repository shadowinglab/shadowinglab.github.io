<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shadowing Lab</title>
<link rel="stylesheet" href="gate.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: course-player shell — sticky progress bar on top, collapsible session list on the left with completion circles, session content on the right */
:root{
  --bg:#F2F4F9; --paper:#FFFFFF; --ink:#141A2E; --muted:#5E6680; --line:#DCE1EC; --line-2:#ECEFF5;
  --primary:#3653D4; --primary-ink:#FFFFFF; --soft:#E8ECFB; --bar:#3653D4; --bar-ink:#FFFFFF;
  --accent:#DD9533; --accent-soft:#FBEEDB; --good:#2E8657; --good-soft:#DEF1E5; --bad:#C2453A; --bad-soft:#FBE5E2;
  --f-display:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --paper:#161B2C; --ink:#E5E9F5; --muted:#99A1BA; --line:#2A3148; --line-2:#1F2537;
  --primary:#91A5FF; --primary-ink:#0E1220; --soft:#1E2643; --bar:#26338A; --bar-ink:#FFFFFF;
  --accent:#EBB056; --accent-soft:#382B15; --good:#5CC48B; --good-soft:#153024; --bad:#EE7A6F; --bad-soft:#3A1C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1220; --paper:#161B2C; --ink:#E5E9F5; --muted:#99A1BA; --line:#2A3148; --line-2:#1F2537;
  --primary:#91A5FF; --primary-ink:#0E1220; --soft:#1E2643; --bar:#26338A; --bar-ink:#FFFFFF;
  --accent:#EBB056; --accent-soft:#382B15; --good:#5CC48B; --good-soft:#153024; --bad:#EE7A6F; --bad-soft:#3A1C19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.ar{font-family:var(--f-ar);direction:rtl}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:is(button,select,input,textarea):focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);color:var(--bar-ink)}
.tb-in{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.tb-brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.tb-brand svg{width:26px;height:26px;flex:none}
.tb-brand b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;white-space:nowrap}
.tb-brand span{opacity:.8;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-prog{font-size:.95rem;white-space:nowrap}
.tb-prog b{font-weight:700}
.tb-btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(255,255,255,.75);background:transparent;color:var(--bar-ink);border-radius:8px;padding:8px 16px;font-weight:700;font-size:1rem}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-btn.done{background:#fff;color:#1F7A4D;border-color:#fff}
.tb-btn svg{width:20px;height:20px}
.menu-btn{display:none;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:var(--bar-ink);border-radius:8px;padding:6px 12px;font-weight:700}
.voice{display:flex;gap:6px;align-items:center;font-size:.82rem}
.voice select{max-width:190px;font:inherit;font-size:.82rem;padding:5px 6px;border-radius:7px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:var(--bar-ink)}
.voice select option{color:#141A2E}
@media (max-width:980px){.menu-btn{display:inline-flex}.tb-brand span{display:none}}

/* shell */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:330px minmax(0,1fr);gap:0;align-items:start;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
@media (max-width:980px){.shell{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--paper);border-right:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);max-height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow:auto;padding-bottom:20px}
@media (max-width:980px){.side{display:none;position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}body.menu-open .side{display:block}}
.sec-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:0;border-bottom:1px solid var(--line);padding:13px max(16px,env(safe-area-inset-left,0px)) 13px 16px;text-align:left;color:var(--primary);font-weight:700;font-size:1rem}
.sec-h .cnt{color:var(--muted);font-weight:400;font-size:.85rem;display:flex;align-items:center;gap:10px}
.sec-h .chev{width:14px;height:14px;transition:transform .2s}
.sec-h[aria-expanded="false"] .chev{transform:rotate(180deg)}
.mod-l{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 16px 4px;display:flex;justify-content:space-between}
.it{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) 22px;gap:10px;align-items:center;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line-2);padding:11px 16px;font-size:.92rem;font-weight:700;color:var(--ink)}
.it:hover{background:var(--bg)}
.it.on{background:var(--soft);color:var(--primary)}
.it .ic{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--paper);display:grid;place-items:center}
.it.on .ic{background:var(--primary)}
.it .ic svg{width:12px;height:12px}
.it .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .lb small{display:block;font-weight:400;color:var(--muted);font-size:.76rem;overflow:hidden;text-overflow:ellipsis}
.cir{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;background:var(--paper)}
.cir.d{background:var(--good);border-color:var(--good)}
.cir svg{width:12px;height:12px}
.streak-box{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.streak-box b{font-family:var(--f-display);font-size:1.5rem}
.streak-box small{color:var(--muted);font-size:.78rem}
.days{display:flex;gap:3px}
.days span{width:11px;height:11px;border-radius:3px;background:var(--line-2);border:1px solid var(--line)}
.days span.p{background:var(--accent-soft);border-color:var(--accent)}
.days span.f{background:var(--good);border-color:var(--good)}
.days span.t{outline:1.5px solid var(--ink);outline-offset:1px}

/* main */
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
@media (min-width:981px){.main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
.lhead{padding:4px 2px 0}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.lhead h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.1;margin:4px 0 10px;text-wrap:balance;letter-spacing:-.015em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 12px;font-size:.85rem;background:var(--paper);border:1px solid var(--line)}
.chip.g{background:var(--accent-soft);border-color:transparent}
.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:16px}

.pp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.78rem;color:var(--muted);background:var(--paper)}
.pp b{display:block;font-family:var(--f-display);font-size:1.05rem;color:var(--ink)}
.pp.ok{border-color:var(--good);background:var(--good-soft)}
.pp.ok b::after{content:" ✓";color:var(--good)}
.banner{border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;justify-content:space-between}
.banner.ok{background:var(--good-soft);border:1px solid var(--good)}
.banner.warn{background:var(--accent-soft);border:1px solid var(--accent)}
.banner b{font-family:var(--f-display);font-size:1.1rem}
.banner p{margin:2px 0 0;font-size:.92rem}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;position:relative;padding:34px 22px 22px;min-width:0}
@media (max-width:520px){.card{padding:32px 16px 18px}}
.tag{position:absolute;top:-1px;left:20px;background:var(--primary);color:var(--primary-ink);font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px 7px;border-radius:0 0 6px 6px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-h h2,.card-h h3{font-family:var(--f-display);font-size:1.25rem;margin:0}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:.9rem;margin-bottom:14px}
.note .ar{display:block;margin-top:3px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 15px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.good{background:var(--good-soft);border-color:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* player */
.mode{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.mode button{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 14px;font-weight:700;display:flex;gap:8px;align-items:center}
.mode button.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.mode button small{font-weight:400;color:var(--muted)}
.player{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 18px;align-items:center}
.play{width:58px;height:58px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.play svg{width:24px;height:24px}
.pbar{display:flex;flex-direction:column;gap:6px;min-width:0}
.track-line{height:6px;background:var(--line-2);border-radius:6px;overflow:hidden}
.track-line i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.pmeta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:8px;flex-wrap:wrap}
.ctrls{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;border-top:1px solid var(--line-2);padding-top:14px}
.ctrl{display:flex;gap:7px;align-items:center;font-size:.82rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:5px 10px;font-size:.84rem;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.bank-tools .seg{max-width:100%;overflow-x:auto}
.bank-tools .seg button{white-space:nowrap}
.turn{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:.85rem}
.turn.go{color:var(--ink)}
.turn.go::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.turn.go::before{animation:none}.track-line i,.sec-h .chev{transition:none}}

/* passage */
.passage{font-size:1.16rem;line-height:1.9;max-width:68ch}
.passage p{margin:0 0 .9em}
.dl{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;margin:0 0 .55em!important;line-height:1.75}
.who{font-family:var(--f-display);font-weight:700;font-size:.85rem;color:var(--primary);padding-top:.25em;text-transform:uppercase;letter-spacing:.05em}
@media (max-width:520px){.dl{grid-template-columns:minmax(0,1fr);gap:0}}
.s{border-radius:4px;padding:1px 2px;cursor:pointer;transition:background .15s}
.s:hover{background:var(--soft)}
.s.on{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.vw{text-decoration:underline dotted var(--muted);text-underline-offset:4px}
.hidden-msg{border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
.foot{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);margin-top:16px;padding-top:12px}

/* grammar + quiz */
.gtable{display:grid;gap:6px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;padding:10px 14px;border-radius:9px;background:var(--bg);font-size:.95rem}
.grow em{font-style:normal;font-weight:700}
@media (max-width:620px){.grow{grid-template-columns:minmax(0,1fr);gap:2px}}
.qs{display:grid;gap:10px;margin-top:16px}
.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qt{margin-bottom:9px}
.qt .n{font-family:var(--f-display);font-weight:700;color:var(--primary);margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 13px;font-weight:700}
.opt:not(:disabled):hover{border-color:var(--primary)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sub-h{font-family:var(--f-display);font-size:1.05rem;margin:18px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.score{font-family:var(--f-display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}

/* vocab */
.vtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}
.vtab{border:0;background:none;border-radius:8px;padding:8px 12px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;font-size:.98rem}
.vtab .b{font-size:.72rem;background:var(--soft);color:var(--primary);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.vtab.on{background:var(--primary);color:var(--primary-ink)}
.vtab.on .b{background:var(--paper);color:var(--primary)}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
@media (max-width:760px){.vgrid{grid-template-columns:minmax(0,1fr)}}
.vcard{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:30px 16px 14px;position:relative;min-width:0}
.vcard .rib{position:absolute;top:0;left:14px;background:var(--primary);color:var(--primary-ink);font-size:.6rem;font-weight:700;letter-spacing:.12em;padding:3px 8px 5px;border-radius:0 0 5px 5px}
.vtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vno{font-family:var(--f-display);font-size:.8rem;color:var(--primary);width:22px}
.vword{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.vpos{font-size:.78rem;color:var(--accent);font-style:italic;margin:0 0 8px 30px}
.var{font-family:var(--f-ar);direction:rtl;font-weight:600;color:var(--primary);margin-left:auto}
.vrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 0 7px 30px;font-size:.92rem}
.vrow+.vrow{border-top:1px dashed var(--line)}
.vrow .lab{font-size:.64rem;font-weight:700;letter-spacing:.1em;color:var(--primary);padding-top:4px}
@media (max-width:420px){.vrow{padding-left:0}.vpos{margin-left:0}}
.ico{border:0;background:var(--soft);border-radius:50%;width:30px;height:30px;display:inline-grid;place-items:center;flex:none;color:var(--primary)}
.ico svg{width:15px;height:15px}
.ttable{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) auto 96px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line-2)}
.trow.h{border-top:0;background:var(--bg);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.trow.act{background:var(--good-soft)}
.trow .w{font-weight:700}
.trow .pos{font-style:italic;color:var(--muted);font-size:.85rem}
.trow .st{text-align:right;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.trow.act .st{color:var(--good)}
.boxes{display:flex;gap:6px}
.boxes button{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);padding:0;display:grid;place-items:center;font-size:.8rem}
.boxes button.f{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
@media (max-width:620px){.trow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.trow .pos{display:none}.trow.h{display:none}.trow .st{grid-column:2;grid-row:1}.boxes{grid-column:1/-1}}
.prompts{display:grid;gap:10px}
.prompt{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.prompt.done{border-color:var(--good);background:var(--good-soft)}
.pn{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--primary)}
.pact{display:flex;gap:6px;align-items:center}
.timer{font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
@media (max-width:600px){.prompt{grid-template-columns:36px minmax(0,1fr)}.pact{grid-column:2}}

/* voice coach */
.ctasks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ctasks button{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 12px;font-weight:700;font-size:.86rem}
.ctasks button.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.ctask{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-weight:700}
.micbox{border:2px dashed var(--primary);border-radius:14px;background:var(--soft);padding:12px;margin-bottom:10px}
.micbox .mh{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--primary);margin-bottom:8px;font-size:.92rem}
.micbox .mh svg{width:22px;height:22px;flex:none}
#coachIn{width:100%;min-height:120px;font:inherit;font-size:1.08rem;line-height:1.6;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical;display:block}
.cstate{color:var(--muted);font-size:.88rem}
.cres{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:16px}
.chead{display:flex;gap:14px;align-items:center}
.cscore{width:66px;height:66px;border-radius:50%;border:3px solid var(--good);display:grid;place-items:center;flex:none;font-size:.8rem;color:var(--muted);text-align:center;line-height:1}
.cscore b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--ink)}
.cscore.mid{border-color:var(--accent)} .cscore.low{border-color:var(--bad)}
.chead p{margin:4px 0 0}
.clab{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);margin-bottom:6px}
.cquote{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:6px;font-size:1.08rem;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.cquote.pro{border-left-color:var(--primary);background:var(--soft)}
.cquote .acts{display:flex;gap:6px;flex:none}
.slow{border:0;background:var(--paper);border-radius:999px;height:30px;padding:0 10px;font-size:.75rem;font-weight:700;color:var(--primary)}
.clist{margin:0;padding-left:22px;display:grid;gap:10px}
.cw{text-decoration:line-through;color:var(--bad)}
.cr{color:var(--good);font-weight:700}
.ctip{color:var(--muted);font-size:.92rem;margin-top:2px}
.cok{color:var(--good);font-weight:700}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.84rem;color:var(--muted)}
.wchip.on{border-color:var(--good);background:var(--good-soft);color:var(--ink);font-weight:700}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted)}

/* word bank */
.bank-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bank-tools input{flex:1;min-width:180px;font:inherit;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btable{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,.8fr) minmax(0,1.6fr) 96px auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-2);font-size:.92rem}
.brow.h{border-top:0;background:var(--bg);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brow .w{font-weight:700}
.brow .w small{display:block;font-weight:400;font-style:italic;color:var(--accent)}
.brow .ex{color:var(--muted);font-size:.86rem}
.brow .src{border:0;background:none;color:var(--primary);font-weight:700;font-size:.8rem;padding:0;text-align:left}
.brow.act{background:var(--good-soft)}
.fav{border:0;background:none;padding:3px;width:28px;height:28px;display:inline-grid;place-items:center;flex:none;cursor:pointer;border-radius:50%;color:var(--line);vertical-align:middle}
.fav svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linejoin:round}
.fav:hover{background:var(--bg)}
.fav.on svg{fill:#F5B301;stroke:#E0A100}
.brow .wl{display:inline-flex;align-items:center;gap:2px}
#favCard .btable{border-color:#F2D58A}
.srcm{display:flex;align-items:center;gap:6px}
.mine-chip{font-size:.72rem;font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.brow .del{border:0;background:none;color:var(--muted);font-size:1rem;line-height:1;padding:2px 4px;border-radius:6px;cursor:pointer}
.brow .del:hover{color:var(--ink);background:var(--bg)}
.qadd{display:flex;gap:8px}
.vimg.noimg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;background:linear-gradient(135deg,var(--soft),var(--bg))}
.vimg.noimg .nw{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,4vw,2rem);color:var(--primary);line-height:1.15}
.vimg.noimg .na{font-family:var(--f-ar);direction:rtl;font-size:1.05rem;color:var(--ink);opacity:.8}
.vcard.mine .rib{background:var(--accent)}
.vcard.xp .rib{background:#0E7C6B}
.vimg.xbox{background:linear-gradient(135deg,#E3F4F0,var(--bg))}
.vimg.xbox .nw{color:#0E7C6B}
.vsec{grid-column:1/-1;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 16px;background:var(--bg);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.vsec b{font-family:var(--f-display);font-size:1.05rem;color:#0E7C6B}
.vsec span{color:var(--muted);font-size:.86rem}
.vsec .ar{flex-basis:100%}
.trow.tsec{color:#0E7C6B}
.vnote{font-family:var(--f-ar);color:var(--muted);font-size:.88rem;line-height:1.6}
.vexar{display:block;font-family:var(--f-ar);color:var(--muted);font-size:.86rem;margin-top:3px}
.vmine{display:flex;gap:14px;justify-content:flex-end;padding-top:6px}
.vmine .lnk{margin:0;font-size:.78rem}
.vadd{background:var(--bg)}
.vaddin{display:flex;flex-direction:column;gap:8px;justify-content:center;height:100%}
.vaddin b{font-family:var(--f-display);font-size:1.05rem}
.vaddin p{margin:0;color:var(--muted);font-size:.88rem}
.vcard.flash{animation:fl 2.4s ease-out}
.addf select{font:inherit;font-size:.95rem;font-weight:400;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.qadd input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.qadd .qgo{font-size:1.4rem;line-height:1;width:52px;padding:0;justify-content:center}
.lnk{border:0;background:none;color:var(--primary);font-weight:600;font-size:.84rem;padding:0;margin-left:auto;cursor:pointer;text-decoration:underline}
.arnote{display:block;font-size:.8rem;color:var(--muted);margin-top:3px;line-height:1.5}
.brow .exar{color:var(--muted);font-size:.84rem;margin-top:2px}
.ico.sm{width:22px;height:22px;vertical-align:middle}
.ico.sm svg{width:13px;height:13px}
.brow.flash{animation:fl 2.4s ease-out}
@keyframes fl{0%,40%{background:var(--good-soft)}100%{background:transparent}}
.addf{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:12px}
.addf label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600}
.addf .fw{grid-column:1/-1}
.addf input{font:inherit;font-size:.95rem;font-weight:400;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
@media (max-width:600px){.addf{grid-template-columns:1fr}}
.mini{display:flex;gap:3px}
.mini button{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:var(--paper);padding:0}
.mini button.f{background:var(--primary);border-color:var(--primary)}
@media (max-width:860px){.brow{grid-template-columns:34px minmax(0,1fr) auto}.brow.h{display:none}.brow .arw{grid-column:2}.brow .mn{grid-column:2/-1}.brow .src,.brow .srcm{grid-column:2}.brow .mini{grid-column:3;grid-row:1}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.verdict{border-radius:12px;padding:14px 16px;margin-top:14px;font-weight:700}
.verdict.no{background:var(--accent-soft)}
.verdict.yes{background:var(--good-soft);border:1px solid var(--good)}
.verdict ul{margin:6px 0 0;padding-left:18px;font-weight:400;font-size:.92rem}
.map{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) 110px;gap:12px;align-items:center;padding:9px 14px;border:0;border-top:1px solid var(--line-2);font-size:.92rem;background:var(--paper);text-align:left;width:100%}
.mrow:first-child{border-top:0}
.mrow:hover{background:var(--bg)}
.mrow .id{font-family:var(--f-display);font-weight:700;color:var(--primary)}
.mrow .st{font-size:.8rem;text-align:right;color:var(--muted)}
.mrow .st.d{color:var(--good);font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mstep{border-radius:12px;background:var(--bg);padding:14px}
.mstep .k{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mstep h4{font-family:var(--f-display);margin:2px 0 4px;font-size:1.05rem}
.mstep p{margin:0;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.warn{background:var(--bad-soft);border-radius:10px;padding:10px 14px;font-size:.9rem}

/* typography: DM Sans scale (matches the reference) */
:root{--ink-2:#3E4557}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink-2:#C4CADA}}
:root[data-theme="dark"]{--ink-2:#C4CADA}
body{font-weight:400;-webkit-font-smoothing:antialiased}
.lhead h1{font-weight:700;color:var(--primary);font-size:clamp(2rem,4.2vw,2.6rem);letter-spacing:-.03em;line-height:1.08;margin:6px 0 8px}
.kicker{display:flex;align-items:center;gap:10px;font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--primary)}
.kicker::before{content:"";width:24px;height:1px;background:currentColor}
.card-h h2,.card-h h3{font-weight:700;letter-spacing:-.02em}
.card-h h2.big{font-size:clamp(1.6rem,3.4vw,2.2rem);color:var(--primary);line-height:1.1;margin-top:6px}
.eyebrow{font-size:.7rem;letter-spacing:.12em}
.passage{font-size:1rem;line-height:2.05;color:var(--ink-2);max-width:74ch}
.passage p{margin:0 0 1.15em}
.s.on{background:var(--soft);box-shadow:none;border-radius:6px;padding:2px 4px}
.btn{font-weight:500}
.btn.pri{font-weight:700}
.tag{font-weight:700}
.chip.lv{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:700}
/* passage / dialogue switch */
.parts{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.parts button{border:0;background:var(--bg);border-radius:999px;padding:7px 15px;font-weight:700;font-size:.88rem;color:var(--muted)}
.parts button.on{background:var(--primary);color:var(--primary-ink)}
/* dialogue */
.dialogue{display:grid;gap:4px;max-width:80ch}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:10px 12px;border-radius:10px;line-height:1.95;font-size:1rem;color:var(--ink-2);margin:0!important}
.dl.mine{background:var(--soft)}
.dl .who{font-family:var(--f-body);font-weight:700;font-size:.74rem;color:var(--primary);text-transform:uppercase;letter-spacing:.09em;padding-top:.45em}
.dl .who em{font-style:normal;display:inline-block;background:var(--primary);color:var(--primary-ink);border-radius:999px;padding:0 7px;font-size:.6rem;margin-left:4px;letter-spacing:.05em;vertical-align:1px}
.dl.mine.hid .tx{filter:blur(6px);cursor:pointer;user-select:none}
.dl.mine.hid .tx.show{filter:none}
@media (max-width:560px){.dl{grid-template-columns:minmax(0,1fr);gap:2px}}
/* phrases */
.phl{display:grid}
.ph{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line-2)}
.ph:first-child{border-top:0}
.ph .en{font-weight:500}
.ph .ar{color:var(--muted);font-size:.9rem;text-align:left}
.src{border:0;background:none;color:var(--primary);font-weight:700;font-size:.8rem;padding:0}

.vimg{margin:2px 0 12px;border-radius:10px;overflow:hidden;aspect-ratio:16/10;background:var(--bg);max-width:100%}
.spr{display:block;width:100%;height:100%;background-size:400% 300%;background-repeat:no-repeat;background-color:var(--bg)}
.spr.qimg{width:100%;max-width:280px;height:auto;aspect-ratio:16/10;border-radius:10px;margin-bottom:10px}
.spr.bthumb{width:64px;height:40px;border-radius:7px;margin-bottom:6px}

.side-sw{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.side-sw button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px;font-weight:700;font-size:.82rem;color:var(--muted)}
.side-sw button.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.plan-h{display:flex;justify-content:space-between;padding:12px 16px 6px;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.day .sec-h{background:var(--paper);font-size:.95rem}
.day.cur .sec-h{background:var(--soft)}
.day.full .sec-h{color:var(--good)}
.dd{font-weight:400;color:var(--muted)}
.tday{display:inline-block;background:var(--primary);color:var(--primary-ink);border-radius:999px;font-size:.62rem;padding:1px 8px;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px;margin-left:4px}
</style>

<header class="topbar">
  <div class="tb-in">
    <button class="menu-btn" id="menuBtn" aria-expanded="false">Menu</button>
    <div class="tb-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg><b>Shadowing Lab</b><span id="tbTitle"></span></div>
    <div class="voice"><label for="voiceSel">Voice</label><select id="voiceSel"></select></div>
    <div class="tb-prog" id="tbProg"></div>
    <button class="tb-btn" id="markBtn" hidden></button>
  </div>
</header>
<div class="shell">
  <aside class="side" id="side" aria-label="Course sessions"></aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<link rel="stylesheet" href="theme.css">
<div id="gate" class="gate">
  <form id="loginForm" class="gate-card" autocomplete="on">
    <div class="gate-logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#3653D4"/><path d="M9 20c2-6 5-9 7-9s5 3 7 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="16" cy="22" r="2" fill="#DD9533"/></svg><b>Shadowing Lab</b></div>
    <h1>Sign in</h1>
    <p class="gate-sub ar">ادخل بالإيميل والباسورد اللي وصلوك</p>
    <label>Email<input id="lgEmail" type="email" required autocomplete="username" inputmode="email"></label>
    <label>Password<input id="lgPass" type="password" required autocomplete="current-password"></label>
    <button id="lgBtn" type="submit">Sign in</button>
    <p id="lgMsg" class="gate-msg" role="alert"></p>
    <button id="lgForgot" type="button" class="gate-link">Forgot password?</button>
  </form>
</div>
<div id="acct" class="acct" hidden><span id="acctMail"></span><button id="impOpen" type="button">Import progress</button><button id="lgOut" type="button">Sign out</button></div>
<div id="imp" class="gate" hidden>
  <div class="gate-card">
    <h1>Import progress</h1>
    <p class="gate-sub ar">افتح نسختك القديمة، دوس Export progress، وارجع الصق هنا ودوس Import.</p>
    <textarea id="impText" rows="6" placeholder="Paste here" style="font:inherit;font-size:.85rem;padding:10px;border-radius:10px;border:1px solid var(--line,#DCE1EC);background:var(--paper,#fff);color:var(--ink,#141A2E);resize:vertical"></textarea>
    <button id="impGo" type="button" class="gate-pri">Import</button>
    <p id="impMsg" class="gate-msg" role="alert"></p>
    <button id="impClose" type="button" class="gate-link">Cancel</button>
  </div>
</div>
<script type="module" src="auth.js"></script>
